# Configuration for UB-Mesh Topology (UB_32_new)
# Intra-server bandwidth: 7200 Gbps (900 GB/s)
# Inter-server bandwidth: 2800 Gbps (350 GB/s)
# Updated congestion control parameters for high-bandwidth tiers

ENABLE_QCN 1
USE_DYNAMIC_PFC_THRESHOLD 1

PACKET_PAYLOAD_SIZE 1500  # Standard MTU size

# FLOW_FILE ./flow1.txt  # Only needed if you're not using -w
# TRACE_FILE ./trace1.txt  # Same as above

TRACE_OUTPUT_FILE ./astra-sim-alibabacloud/inputs/output/llama_trace.tr
FCT_OUTPUT_FILE ./astra-sim-alibabacloud/inputs/output/fct.txt
PFC_OUTPUT_FILE ./astra-sim-alibabacloud/inputs/output/pfc.txt

BW_MON_FILE ./astra-sim-alibabacloud/inputs/output/bw.txt
QLEN_MON_FILE ./astra-sim-alibabacloud/inputs/output/qlen.txt
RATE_MON_FILE ./astra-sim-alibabacloud/inputs/output/rate.txt
CNP_MON_FILE ./astra-sim-alibabacloud/inputs/output/cnp.txt



SIMULATOR_STOP_TIME 40000000000000.00

CC_MODE 1
ALPHA_RESUME_INTERVAL 1
RATE_DECREASE_INTERVAL 4
CLAMP_TARGET_RATE 0
RP_TIMER 900 
EWMA_GAIN 0.00390625
FAST_RECOVERY_TIMES 1
RATE_AI 100Gb/s
RATE_HAI 200Gb/s
MIN_RATE 10Gb/s
DCTCP_RATE_AI 150Gb/s

#RATE_AI 50Mb/s
#RATE_HAI 100Mb/s
#MIN_RATE 100Mb/s
#DCTCP_RATE_AI 1000Mb/s

ERROR_RATE_PER_LINK 0.00001
L2_CHUNK_SIZE 4000
L2_ACK_INTERVAL 1
L2_BACK_TO_ZERO 0

HAS_WIN 1
GLOBAL_T 0
VAR_WIN 1
FAST_REACT 1
U_TARGET 0.95
MI_THRESH 0
INT_MULTI 1
MULTI_RATE 0
SAMPLE_FEEDBACK 0
PINT_LOG_BASE 1.05
PINT_PROB 1.0

RATE_BOUND 1

ACK_HIGH_PRIO 0

LINK_DOWN 0 0 0

ENABLE_TRACE 1

# Updated for UB-Mesh topology with 2.8Tbps and 7.2Tbps bandwidth tiers
KMAX_MAP 5  100000000000 800  1000000000000 1600  2800000000000 3200  5000000000000 4800  7200000000000 8000
KMIN_MAP 5  100000000000 200  1000000000000 400  2800000000000 800  5000000000000 1200  7200000000000 2000
PMAX_MAP 5  100000000000 0.1  1000000000000 0.15  2800000000000 0.2  5000000000000 0.25  7200000000000 0.3

BUFFER_SIZE 512  # Increased for high bandwidth UB-Mesh topology

# QLEN_MON_FILE /etc/astra-sim/simulation/llama_hpn7_qlen.txt
# BW_MON_FILE /etc/astra-sim/simulation/llama_hpn7_bw.txt
# RATE_MON_FILE /etc/astra-sim/simulation/llama_hpn7_rate.txt
# CNP_MON_FILE /etc/astra-sim/simulation/llama_hpn7_cnp.txt
MON_START 0
MON_END 20000
QP_MON_INTERVAL 10
QLEN_MON_INTERVAL 1000
BW_MON_INTERVAL 1000